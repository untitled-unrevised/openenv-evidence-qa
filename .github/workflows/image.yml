# Adapted from GitHub's documented container publishing pattern.
# Manual dispatch publishes only this experiment's approved image.
name: Build and optionally publish Evidence QA
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected experiment image
        type: boolean
        default: false
        required: true
      recipe:
        description: Select the v1 baseline or original search curriculum
        type: choice
        options:
          - v1
          - search-v2
        default: v1
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select fixed build recipe
        env:
          RECIPE: ${{ inputs.recipe }}
        run: |
          case "$RECIPE" in
            v1|'')
              echo 'DOCKERFILE=Dockerfile' >> "$GITHUB_ENV"
              echo 'IMAGE=ghcr.io/untitled-unrevised/evidence-qa:v1' >> "$GITHUB_ENV"
              ;;
            search-v2)
              echo 'DOCKERFILE=Dockerfile.search' >> "$GITHUB_ENV"
              echo 'IMAGE=ghcr.io/untitled-unrevised/evidence-qa:search-v2' >> "$GITHUB_ENV"
              ;;
            *) exit 2 ;;
          esac
      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 -f "$DOCKERFILE" --label org.opencontainers.image.source=https://github.com/untitled-unrevised/openenv-evidence-qa -t "$IMAGE" .
      - name: Check container endpoints
        shell: bash
        run: |
          docker run -d --name evidence-qa-check "$IMAGE"
          trap 'docker stop evidence-qa-check' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec evidence-qa-check python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec evidence-qa-check openenv validate --url http://127.0.0.1:8000
          if [[ "$DOCKERFILE" == 'Dockerfile.search' ]]; then
            # Reference policies are copied into this disposable test container
            # after the build; they are never added to the published image.
            docker exec evidence-qa-check mkdir -p /app/scripts /app/tests
            docker cp scripts/search_check.py evidence-qa-check:/app/scripts/search_check.py
            docker cp tests/search_solutions.py evidence-qa-check:/app/tests/search_solutions.py
            docker exec evidence-qa-check python /app/scripts/search_check.py --url http://127.0.0.1:8000
          fi
      - name: Publish only when explicitly selected
        if: ${{ inputs.publish }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u untitled-unrevised --password-stdin
          docker push "$IMAGE"
