# Adapted from GitHub's documented container publishing pattern.
# Manual dispatch publishes only this experiment's approved image.
name: Build and optionally publish Evidence QA
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish ghcr.io/untitled-unrevised/evidence-qa:v1
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 --label org.opencontainers.image.source=https://github.com/untitled-unrevised/openenv-evidence-qa -t ghcr.io/untitled-unrevised/evidence-qa:v1 .
      - name: Check container endpoints
        shell: bash
        run: |
          docker run -d --name evidence-qa-check ghcr.io/untitled-unrevised/evidence-qa:v1
          trap 'docker stop evidence-qa-check' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec evidence-qa-check python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec evidence-qa-check openenv validate --url http://127.0.0.1:8000
      - name: Publish only when explicitly selected
        if: ${{ inputs.publish }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u untitled-unrevised --password-stdin
          docker push ghcr.io/untitled-unrevised/evidence-qa:v1
